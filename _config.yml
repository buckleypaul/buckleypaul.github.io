# Site settings
title:          Paul Buckley's Site
description:    "Paul Buckley's personal website"
author:         Paul Buckley
lang:           en
baseurl:        ""
url:            "https://paulbuckley.me"

# https://jekyllrb.com/docs/configuration/options/
timezone: America/Los_Angeles

# Available style options based on tamarack: clearing (light), thicket (dark)
style_light: clearing
style_dark: thicket

#include pages
include:
  - _pages

# Assets
sass:
  sass_dir:     /assets/css/_sass
  style:        compressed

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
